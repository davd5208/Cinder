<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinder</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="popup-app">
        <section class="hero">
            <div class="hero-brand" aria-hidden="true">
                <img src="logo.svg" alt="" class="hero-brand-icon">
            </div>

            <div class="hero-copy">
                <p class="eyebrow">YouTube focus helper</p>
                <h1>Cinder</h1>
                <p class="hero-text">
                    Nastav si zdravy limit sledovania. Cinder ti postrazi pocet otvorenych videi
                    a jemne ta zastavi, ked je cas dat si pauzu.
                </p>
            </div>
        </section>

        <section class="overview">
            <div class="overview-head">
                <span id="state-pill" class="state-pill">V pohode</span>
                <span id="session-caption" class="session-caption">Dnesna seria</span>
            </div>

            <div class="metric-grid">
                <article class="metric-tile">
                    <span class="metric-label">Pozrete videa</span>
                    <strong id="watched-count" class="metric-value">0</strong>
                </article>

                <article class="metric-tile">
                    <span class="metric-label">Este mozes</span>
                    <strong id="remaining-count" class="metric-value">0</strong>
                </article>
            </div>

            <div class="progress-group">
                <div class="progress-meta">
                    <span>Stav limitu</span>
                    <span id="progress-text">0 / 5</span>
                </div>

                <div class="progress-track" aria-hidden="true">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>
        </section>

        <form id="settings-form" class="settings-form">
            <div class="field-head">
                <label for="video-limit">Denny limit videi</label>
                <span class="field-hint">Jednoducho zmenis kedykolvek</span>
            </div>

            <div class="input-shell">
                <input id="video-limit" name="video-limit" type="number" min="1" step="1" required inputmode="numeric">
                <span class="input-suffix">videi</span>
            </div>

            <div class="preset-group" role="group" aria-label="Rychle nastavenia">
                <button type="button" class="preset-button" data-limit="3">3</button>
                <button type="button" class="preset-button" data-limit="5">5</button>
                <button type="button" class="preset-button" data-limit="8">8</button>
                <button type="button" class="preset-button" data-limit="12">12</button>
            </div>

            <div class="actions">
                <button type="submit" class="primary-button">
                    <svg viewBox="0 0 20 20" aria-hidden="true">
                        <path d="M4 10.5L8 14.5L16 6.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                    <span>Ulozit</span>
                </button>

                <button type="button" id="reset-count" class="secondary-button">
                    <svg viewBox="0 0 20 20" aria-hidden="true">
                        <path d="M4.5 5.5V10H9" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                        <path d="M5.2 10A5.5 5.5 0 1 0 10 4.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                    <span>Reset</span>
                </button>
            </div>
        </form>

        <p id="status" class="status-text" aria-live="polite"></p>
    </main>

    <script src="popup.js"></script>
</body>
</html>
